<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Каталог услуг Динары — AI Video Creator." />
  <title>Каталог — Динара</title>
  <meta name="theme-color" content="#13242e" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="Динара — AI Video Creator" />
  <meta property="og:title" content="Каталог услуг — Динара" />
  <meta property="og:description" content="Готовые форматы AI-видео с ценами: ролики для бизнеса, детские мультфильмы, скетчи, монтаж и сторис." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23e8a53a'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='%231a2a32'%3E%D0%94%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=42" />
</head>
<body class="page-catalog">
  <header class="top top--solid">
    <a class="logo" href="index.html">Динара</a>
    <div class="top__right">
      <nav class="nav" aria-label="Основная навигация">
        <a href="index.html#about">Обо мне</a>
        <a href="index.html#directions">Услуги</a>
        <a href="catalog.html" aria-current="page">Каталог</a>
        <a href="index.html#contact">Контакт</a>
      </nav>
      <button type="button" class="cart-btn" id="cart-open" aria-label="Открыть корзину">
        <span class="cart-btn__icon" aria-hidden="true">🛒</span>
        <span class="cart-btn__label">Корзина</span>
        <span class="cart-btn__count" id="cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <main class="catalog-page">
    <section class="about catalog-section">
      <div class="about__bg catalog-section__bg" aria-hidden="true">
        <picture>
          <source srcset="catalog-bg.webp" type="image/webp" />
          <img src="catalog-bg.jpg" alt="" width="1920" height="1080" />
        </picture>
      </div>
      <div class="about__inner catalog-inner">
        <div class="catalog-head">
          <div>
            <p class="section-kicker">Каталог</p>
            <h1 class="section-title">Все услуги</h1>
          </div>
          <a class="btn btn--ghost-dark catalog-head__back" href="index.html">← На главную</a>
        </div>
        <div class="shop__grid" id="shop-grid"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap wrap--foot">
      <span>Динара</span>
    </div>
  </footer>

  <div class="cart-drawer" id="cart-drawer" hidden>
    <button type="button" class="cart-drawer__backdrop" id="cart-close-backdrop" aria-label="Закрыть корзину"></button>
    <aside class="cart-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <div class="cart-drawer__head">
        <h2 id="cart-title">Корзина</h2>
        <button type="button" class="cart-drawer__close" id="cart-close" aria-label="Закрыть">×</button>
      </div>
      <div class="cart-drawer__body" id="cart-list"></div>
      <div class="cart-drawer__foot" id="cart-foot" hidden>
        <p class="cart-drawer__total">Итого: <strong id="cart-total"></strong></p>
        <button type="button" class="btn btn--primary cart-drawer__checkout" id="cart-checkout">Оформить заказ</button>
        <button type="button" class="btn btn--ghost-dark cart-drawer__clear" id="cart-clear">Очистить корзину</button>
      </div>
    </aside>
  </div>

  <div class="order-modal" id="order-modal" hidden>
    <div class="order-modal__panel" role="dialog" aria-modal="true" aria-labelledby="order-modal-title">
      <button type="button" class="order-modal__close" id="order-modal-close" aria-label="Закрыть">×</button>
      <h3 id="order-modal-title">Оформление заказа</h3>
      <p class="order-modal__text">Оставьте имя и телефон. Заказ сохранится, и откроется чат с Динарой.</p>
      <ul class="order-modal__summary" id="order-summary"></ul>
      <p class="order-modal__total" id="order-total"></p>
      <form id="order-form" class="order-form">
        <label class="order-field">
          Имя
          <input type="text" id="order-name" name="name" required maxlength="80" autocomplete="name" placeholder="Как к вам обращаться" />
        </label>
        <label class="order-field">
          Телефон с кодом страны
          <span class="order-phone">
            <span class="order-phone__plus" aria-hidden="true">+</span>
            <input type="tel" id="order-phone" name="phone" required maxlength="19" autocomplete="tel" inputmode="numeric" placeholder="7 700 000 00 00" aria-label="Номер телефона с кодом страны" />
          </span>
        </label>
        <p class="order-form__error" id="order-error" hidden></p>
        <div class="order-modal__actions">
          <button type="submit" class="btn btn--primary" data-channel="whatsapp">WhatsApp</button>
          <button type="submit" class="btn btn--tg" data-channel="telegram">Telegram</button>
        </div>
      </form>
    </div>
  </div>

  <script src="products-data.js?v=13"></script>
  <script src="script.js?v=28"></script>
  <script src="chat-widget.js?v=19"></script>
</body>
</html>
